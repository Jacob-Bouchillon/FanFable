<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidence web · 3D</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body class="w3d-body">
  <main id="w3d">
    <canvas id="w3d-canvas" aria-label="Evidence web 3D view"></canvas>

    <header class="w3d-head">
      <div class="w3d-title">
        <strong>Evidence web</strong>
        <span id="w3d-status" class="w3d-muted">loading…</span>
      </div>
      <div id="w3d-counts" class="w3d-counts"></div>
      <div class="w3d-controls">
        <label><input type="checkbox" id="f-people" checked> People</label>
        <label><input type="checkbox" id="f-pairs" checked> Pairs</label>
        <label><input type="checkbox" id="f-births" checked> Births</label>
        <label><input type="checkbox" id="f-meetings" checked> Meetings</label>
        <label><input type="checkbox" id="f-open" checked> Open ends</label>
        <label><input type="checkbox" id="f-all"> All pairs</label>
        <button id="w3d-reset" class="w3d-btn" type="button">Reset view</button>
      </div>
    </header>

    <section id="w3d-evidence" class="w3d-evidence" aria-label="Evidence list">
      <h2>Evidence</h2>
      <div id="w3d-evidence-list" class="w3d-evidence-list"><p class="w3d-muted">loading…</p></div>
    </section>
    <div id="w3d-tooltip" class="w3d-tooltip" hidden></div>

    <aside id="w3d-panel" class="w3d-panel" hidden>
      <button id="w3d-close" class="w3d-close" type="button" aria-label="Close">×</button>
      <div id="w3d-detail"></div>
    </aside>

    <div id="w3d-feed" class="w3d-feed" aria-live="polite"></div>
    <div class="w3d-hint">Drag to orbit · wheel to zoom · click a node</div>
  </main>
  <script src="/ui/web3d.js"></script>
</body>
</html>
